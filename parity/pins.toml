# Pinned oracle inputs. Every one is a released version fetched by digest.
# CI fetches each one, checks its digest, and fails on a mismatch.

[phpstan-phar]
version = "2.3.4"
url = "https://github.com/phpstan/phpstan/releases/download/2.3.4/phpstan.phar"
sha256 = "a961d12cc71941a31ad6560e6a330347d487612628c3202a718f71a59de21a7c"
# Signed by "PHPStan Bot <ondrej+phpstanbot@mirtes.cz>", key CA7C2C7A30C8E8E1274A847651C67305FFC2E5C0.
signature = "https://github.com/phpstan/phpstan/releases/download/2.3.4/phpstan.phar.asc"

[phpstan-src]
# The vendor/phpstan-src submodule, the same release as the phar.
version = "2.3.4"
commit = "034afd3eea56205d2fa8167b74504da774a174ab"

[nikic-php-parser]
# nikic/php-parser's own repository, for its parser fixtures, which the
# composer package leaves out. Pinned by commit: the release tarball leaves
# the tests out too.
version = "v5.9.0"
repository = "https://github.com/nikic/PHP-Parser.git"
commit = "9e33da9553fe7786f0962b35f4e4ecf01be89def"

[php-src]
# php-src's .phpt tests, for their FILE sections.
version = "8.5.4"
url = "https://github.com/php/php-src/archive/refs/tags/php-8.5.4.tar.gz"
sha256 = "0603c1fedb9a67e384ae3f2dea8b1666753cb06364b70c62dae2a0ff59ffa3f2"

[oracle-php]
# The php that runs every extractor. Locally it is the installed php; the
# scoreboard refuses any other version. CI runs in this image, whose
# extractions are byte-identical to the local php's.
version = "8.5.4"
image = "php:8.5.4-cli@sha256:cfa277c10f9f1859addbbed6739673a50a9c1b5777f64c0441118eca148b8056"

[composer]
# Installs phpstan-src's dependencies from its composer.lock, applying its
# patches.
version = "2.9.5"
url = "https://getcomposer.org/download/2.9.5/composer.phar"
sha256 = "c86ce603fe836bf0861a38c93ac566c8f1e69ac44b2445d9b7a6a17ea2e9972a"
