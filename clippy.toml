# Randomly seeded hashing makes iteration order - and so emission order and
# any order-dependent result - differ between runs. Use `FxHashMap`/
# `FxHashSet` (fixed hashing) or an ordered collection instead.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "randomly seeded; use rustc_hash::FxHashMap or an ordered map" },
    { path = "std::collections::HashSet", reason = "randomly seeded; use rustc_hash::FxHashSet or an ordered set" },
    { path = "std::hash::RandomState", reason = "randomly seeded; use rustc_hash::FxBuildHasher" },
]
# Windows' canonical paths carry the verbatim prefix, under which `/`, `.`
# and `..` are names: a path written onto one names no file.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "Windows' verbatim form; use composer::canonical::canonicalize" },
    { path = "std::path::Path::canonicalize", reason = "Windows' verbatim form; use composer::canonical::canonicalize" },
]
