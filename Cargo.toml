[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# Every dependency is declared here, with an exact version, and members
# refer to it with `{ workspace = true }`.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# The cost meter's profile: release optimizations with debug info and no LTO,
# so callgrind and dhat can name functions. It never changes once measured.
[profile.cost]
inherits = "release"
debug = true
