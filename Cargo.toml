[package]
name = "phpstan-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
hotpath = "0.24"
imbl = "7.0.1"
lsp-server = "0.10.0"
md5 = "0.7"
lsp-types = "0.97.0"
pcre2-sys = { version = "0.2.10", optional = true }
rayon = "1"
regex = "1"
roxmltree = "0.20"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlparser = "0.63.0"
mysql = { version = "28.0.2", default-features = false, features = ["rustls-tls", "minimal-rust"] }
postgres = "0.19.14"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype", "column_metadata"] }
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }

[features]
default = ["pcre-validate"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
# Phase 46: `regexp.pattern` validation calls real PCRE2 (via the
# low-level `pcre2-sys` FFI, not the higher-level `pcre2` crate - see
# `src/pcre_validate.rs`'s own doc comment for why) - this project's one
# *optional* C dependency. `cargo build --no-default-features` keeps the
# rest of the crate 100% pure Rust, at the cost of only this one
# diagnostic. `rusqlite`'s own `bundled` feature (live SQL query
# reflection, sub-phase C of `delegated-tumbling-dongarra.md`) is a
# second, always-on C dependency (vendors and compiles SQLite's real C
# source at build time) - deliberately not gated behind a feature flag,
# per the user's own explicit choice recorded in that plan.
pcre-validate = ["dep:pcre2-sys"]
# Phase 19 Part A: `Token`/`Keyword`/`StringPart`/`Position` gain a real
# `arbitrary::Arbitrary` derive under this feature only - the fuzz
# workspace's own `token_stream_parse` target needs it (bypasses the
# lexer, feeding an `arbitrary`-derived token stream straight into
# `Parser::new`), and this keeps the main crate's ordinary build (and
# every other consumer) from ever pulling `arbitrary` in.
fuzzing = ["dep:arbitrary"]

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "vendored_corpus"
harness = false

# `third_party/hotpath` - a vendored, patched `hotpath` 0.24.0 (bumps its
# hardcoded hotpath-alloc frame-depth limit; see
# `third_party/hotpath/HOTPATH_PATCH.md` for why). Zero effect on an
# ordinary build - only the `hotpath`/`hotpath-alloc` features (both
# off by default) exercise the patched code path at all.
[patch.crates-io]
hotpath = { path = "third_party/hotpath" }
