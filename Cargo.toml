[package]
name = "phpstan-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
hotpath = "0.24"
imbl = "7.0.1"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
rayon = "1"
regex = "1"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "vendored_corpus"
harness = false
