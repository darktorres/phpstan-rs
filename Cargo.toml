[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "xtask"]
default-members = ["crates/phpstan-rs"]
exclude = ["fuzz", "tools/builtin-runs", "tools/php-comparison-matrix", "tools/php-images", "tools/phpunit-comparator-matrix"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bumpalo = "=3.20.3"
syntax = { package = "phpstan-rs-syntax", path = "crates/syntax" }
types = { package = "phpstan-rs-types", path = "crates/types" }
phpdoc = { package = "phpstan-rs-phpdoc", path = "crates/phpdoc" }
sql = { package = "phpstan-rs-sql", path = "crates/sql" }
diagnostics = { package = "phpstan-rs-diagnostics", path = "crates/diagnostics" }
composer = { package = "phpstan-rs-composer", path = "crates/composer" }
config = { package = "phpstan-rs-config", path = "crates/config" }
stub-sources = { package = "phpstan-rs-stub-sources", path = "crates/stub-sources" }
dumps = { package = "phpstan-rs-dumps", path = "crates/dumps" }
criterion = "=0.8.2"
hotpath = "=0.26.1"
imbl = "=7.0.2"
la-arena = "=0.3.1"
libmimalloc-sys = { version = "=0.1.49", default-features = false }
proptest = "=1.11.0"
hashbrown = { version = "=0.17.1", default-features = false }
rustc-hash = "=2.1.3"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
twox-hash = { version = "=2.1.4", default-features = false, features = ["std", "xxhash3_128"] }
arrayvec = "=0.7.8"
memchr = "=2.8.3"
crc32fast = "=1.5.2"
stacker = "=0.1.25"
sqlparser = "=0.63.0"
toml = "=1.1.6"

[workspace.lints.rust]
unreachable_pub = "deny"
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Thin LTO with one codegen unit: about 5% faster on the scoped Piwigo
# run (26.7 s vs 28.0 s) for a ~3x longer release build, and it keeps
# cross-crate inlining once the workspace splits into crates.
[profile.release]
lto = "thin"
codegen-units = 1
incremental = true

# `cargo test`: nearly all of a unit test's time is building a `Project`
# over the stub registry, which runs 4-6x faster at `opt-level = 1`, while
# an incremental rebuild stays as quick as at `opt-level = 0`.
[profile.test]
opt-level = 1

# `cargo xtask` runs at `opt-level = 0`; the crates that cut and hash the
# gates' snapshots, gigabytes at a time, are optimized in it.
[profile.dev.package.phpstan-rs-dumps]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# `release` with fat LTO: whole-program inlining across the workspace and
# its dependencies, one codegen unit. Not incremental (LTO discards it), so
# build it in a target directory of its own:
# `CARGO_TARGET_DIR=<dir> nice -n 19 cargo build --profile fat -p phpstan-rs --bin phpstan-rs`.
[profile.fat]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# The regression gates' corpus, type and baseline snapshots: release
# optimizations without LTO, since those outputs don't depend on
# optimization and the gate rebuilds on every commit. The performance
# gate measures `release`. Incremental, unlike `release`: without it any
# edit recompiles the whole crate.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The assertions' build: `gate` with debug assertions and overflow checks,
# so every `debug_assert!` runs over the corpus at release speed. Run with
# `PHPSTAN_RS_NO_FILE_CACHE=1`, so that every file goes through the parse
# the assertions check, none read back from an entry.
[profile.oracle]
inherits = "gate"
debug-assertions = true
overflow-checks = true

# Release-speed build that keeps debug info, so profiles symbolicate their
# call stacks: `dhat-heap`'s output
# (`cargo build -p phpstan-rs --profile dhat --features dhat-heap`) and a
# sampling profiler's (README, "Profiling").
[profile.dhat]
inherits = "release"
debug = 1
lto = false
incremental = true
