[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/phpstan-rs"]
exclude = ["fuzz", "third_party/hotpath"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
syntax = { package = "phpstan-rs-syntax", path = "crates/syntax" }
types = { package = "phpstan-rs-types", path = "crates/types" }

# Thin LTO with one codegen unit: about 5% faster on the scoped Piwigo
# run (26.7 s vs 28.0 s) for a ~3x longer release build, and it keeps
# cross-crate inlining once the workspace splits into crates.
[profile.release]
lto = "thin"
codegen-units = 1

# The regression gates' corpus, type and baseline snapshots: release
# optimizations without LTO, since those outputs don't depend on
# optimization and the gate rebuilds on every commit. The performance
# gate measures `release`.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16

# Release-speed build that keeps debug info, so `dhat-heap`'s output can
# symbolicate call stacks - `cargo build -p phpstan-rs --profile dhat --features dhat-heap`.
[profile.dhat]
inherits = "release"
debug = 1

# `third_party/hotpath` - a vendored, patched `hotpath` 0.24.0 (bumps its
# hardcoded hotpath-alloc frame-depth limit; see
# `third_party/hotpath/HOTPATH_PATCH.md` for why). Zero effect on an
# ordinary build - only the `hotpath`/`hotpath-alloc` features (both
# off by default) exercise the patched code path at all.
[patch.crates-io]
hotpath = { path = "third_party/hotpath" }
