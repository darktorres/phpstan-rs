# mold links, and the parallel compiler front end (`-Z threads`, needs
# the pinned nightly in rust-toolchain.toml) compiles - both matter for
# rebuild time on a crate this large. CI installs mold on its Linux
# runners (`rui314/setup-mold`); clang ships on them already.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Z", "threads=8"]
