[package]
name = "phpstan-rs"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
composer.workspace = true
config.workspace = true
diagnostics.workspace = true
phpdoc.workspace = true
sql.workspace = true
stub-sources.workspace = true
syntax.workspace = true
types.workspace = true
ciborium.workspace = true
crc32fast.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
crossbeam-channel = "=0.5.17"
dhat = { version = "=0.3.3", optional = true }
hotpath.workspace = true
imbl.workspace = true
indexmap = { version = "=2.14.2", features = ["serde"] }
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
mimalloc.workspace = true
pcre2-sys = { version = "=0.2.10", optional = true }
rayon = "=1.12.0"
regex = "=1.13.1"
roxmltree = "=0.21.1"
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
toml.workspace = true

[features]
default = ["pcre-validate"]
# Leaves the allocator to the system's: for comparing it with mimalloc.
system-allocator = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
# One-shot heap profiler (https://docs.rs/dhat): swaps in `dhat::Alloc` as
# the global allocator and dumps a `dhat-heap.json` on clean exit, showing
# which call sites hold live bytes at peak (not just alloc/dealloc churn,
# which `hotpath-alloc` already covers) - use `--profile dhat` (see that
# profile below) to keep symbols for a readable dh_view.html call stack.
dhat-heap = ["dep:dhat"]
# Phase 46: `regexp.pattern` validation calls real PCRE2 (via the
# low-level `pcre2-sys` FFI, not the higher-level `pcre2` crate - see
# `src/pcre_validate.rs`'s own doc comment for why) - this project's one
# *optional* C dependency. `cargo build --no-default-features` keeps the
# rest of the crate 100% pure Rust, at the cost of only this one
# diagnostic. `rusqlite`'s own `bundled` feature (live SQL query
# reflection, sub-phase C of `delegated-tumbling-dongarra.md`) is a
# second, always-on C dependency (vendors and compiles SQLite's real C
# source at build time) - deliberately not gated behind a feature flag,
# per the user's own explicit choice recorded in that plan.
pcre-validate = ["dep:pcre2-sys"]

[dev-dependencies]
criterion.workspace = true
libtest-mimic = "=0.8.2"
proptest.workspace = true

# The fixture suite (tests/fixtures.rs). Each fixture still builds a whole
# Project, stubs included, so a debug run takes ~26 minutes; it runs in the
# `gate` profile instead (`cargo test --profile gate --test fixtures`, part
# of `cargo xtask gates` and Rust CI), and `cargo test --test fixtures --
# <filter>` runs a subset. Plain `cargo test` leaves it out until
# per-fixture setup is cheap.
[[test]]
name = "fixtures"
harness = false
test = false

# The runtime oracle (tests/runtime_oracle.rs): runs every fixture under
# PHP and checks each `assertType()` against the value PHP produced.
# Run explicitly, like the fixture suite.
[[test]]
name = "runtime_oracle"
harness = false
test = false

[[bench]]
name = "vendored_corpus"
harness = false

[lints]
workspace = true
