[package]
name = "phpstan-rs-syntax"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "syntax"

[dependencies]
arbitrary = { version = "=1.4.2", features = ["derive"], optional = true }
hotpath.workspace = true
hashbrown.workspace = true
la-arena.workspace = true
memchr.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
serde.workspace = true
stacker.workspace = true

[features]
# `arbitrary::Arbitrary` for tokens, for the token-stream fuzz target.
fuzzing = ["dep:arbitrary"]
# Counts memo and cache hit rates (`stats`), printed with `PHPSTAN_RS_MEMO_STATS=1`.
memo-stats = []

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "lex_parse"
harness = false

[lints]
workspace = true
