# `cargo deny check`: part of `cargo xtask gates --full` and Rust CI.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rustls-pemfile: unmaintained, pulled in by mysql 28.0.2's `rustls-tls`
    # (the latest mysql release); no maintained replacement is possible
    # without replacing the driver.
    { id = "RUSTSEC-2025-0134", reason = "transitive via mysql 28.0.2 rustls-tls; no upgrade exists" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# webpki 0.22 ships an ISC-style LICENSE file but declares no license field.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = []

# The workspace's own crates are `publish = false`.
[licenses.private]
ignore = true

[bans]
# Duplicate versions come from the DB drivers' dependency trees; reported,
# not fatal.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
