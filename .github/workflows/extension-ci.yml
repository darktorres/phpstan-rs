name: Extension CI

# Path filters cover everything the server binary is built from, not just
# editors/vscode/: the LSP the extension drives depends on the whole
# analyzer and the stubs it embeds, so a regression anywhere there should
# fail this job as loudly as a TypeScript one.
on:
  push:
    paths:
      - "editors/vscode/**"
      - "crates/**"
      - "vendor/phpstan-src"
      - "vendor/phpstorm-stubs/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".gitattributes"
      - ".github/actions/**"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "crates/**"
      - "vendor/phpstan-src"
      - "vendor/phpstorm-stubs/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".gitattributes"
      - ".github/actions/**"
      - ".github/workflows/extension-ci.yml"

# A pull request's newer run cancels the run it supersedes. A push gets a
# group of its own, so pushes neither wait for nor cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    # Node-only - no Rust build needed for the pure/settings/download
    # unit lanes (config.test.ts, serverBinary.test.ts,
    # serverDownload.test.ts, extension.test.ts all run under plain
    # node:test with an injected fetch/fs, never a real subprocess).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      # bun installs and runs the scripts; Node runs the tests.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: editors/vscode/package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('editors/vscode/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run test:unit

  integration:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows images check text out with CRLF. .gitattributes keeps this
      # repository's files LF, but not the phpstan-src submodule's stubs,
      # which the build embeds.
      - name: Check text out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      # bun installs and runs the scripts; Node runs the tests.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: editors/vscode/package.json
      - uses: ./.github/actions/setup-rust

      - name: Build the phpstan-rs release binary
        run: cargo build --release --locked

      - name: Point the smoke test at the built binary
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          bin="phpstan-rs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="phpstan-rs.exe"
          fi
          echo "PHPSTAN_RS_TEST_BIN=$(pwd)/target/release/$bin" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('editors/vscode/bun.lock') }}
      - working-directory: editors/vscode
        run: bun install --frozen-lockfile

      - working-directory: editors/vscode
        run: bun run compile

      # The VS Code build the smoke test downloads: the version
      # engines.vscode names.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package.json') }}

      - name: Run the activation smoke test
        working-directory: editors/vscode
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          # `@vscode/test-electron` launches a real (headless-incapable)
          # Electron window - only Linux runners lack a display server by
          # default; macOS/Windows runner images already have one.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun run test:smoke
          else
            bun run test:smoke
          fi

      # The last VS Code session's logs. The language server's channel holds
      # the server's stderr and the traced messages.
      - name: Print the smoke test's logs
        if: ${{ failure() }}
        working-directory: editors/vscode
        shell: bash
        run: |
          set -euo pipefail
          session="$(find .vscode-test/user-data/logs -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          find "$session" -name '*.log' -print0 | while IFS= read -r -d '' log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
