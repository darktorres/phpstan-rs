name: Extension CI

# Not yet exercised by a real CI run (this repo has no GitHub remote at
# the time this workflow was authored - same caveat as release.yml).
# Path filters cover all Rust source, not just editors/vscode/: the LSP
# the extension drives depends on the whole analyzer, so a Rust-side
# regression anywhere should fail this job as loudly as a TypeScript one.
on:
  push:
    paths:
      - "editors/vscode/**"
      - "crates/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "crates/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/extension-ci.yml"

jobs:
  unit:
    # Node-only - no Rust build needed for the pure/settings/download
    # unit lanes (config.test.ts, serverBinary.test.ts,
    # serverDownload.test.ts, extension.test.ts all run under plain
    # node:test with an injected fetch/fs, never a real subprocess).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      # bun installs and runs the scripts; Node runs the tests.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: editors/vscode/package.json
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run test:unit

  integration:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      # bun installs and runs the scripts; Node runs the tests.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: editors/vscode/package.json

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        if: ${{ runner.os == 'Linux' }}
        with:
          mold-version: 2.42.1

      - name: Build the phpstan-rs release binary
        run: cargo build --release --locked

      - name: Point the smoke test at the built binary
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          bin="phpstan-rs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="phpstan-rs.exe"
          fi
          echo "PHPSTAN_RS_TEST_BIN=$(pwd)/target/release/$bin" >> "$GITHUB_ENV"

      - working-directory: editors/vscode
        run: bun install --frozen-lockfile

      - working-directory: editors/vscode
        run: bun run compile

      - name: Run the activation smoke test
        working-directory: editors/vscode
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          # `@vscode/test-electron` launches a real (headless-incapable)
          # Electron window - only Linux runners lack a display server by
          # default; macOS/Windows runner images already have one.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun run test:smoke
          else
            bun run test:smoke
          fi
