name: Rust CI

# The build and test half of `cargo xtask gates --full`. The corpus,
# type-snapshot, baseline, performance and build-time gates need the
# frozen Piwigo checkout and a stable machine, so they run locally
# through `cargo xtask gates`.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The test-name manifest searches the whole history for its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup show` installs it.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-machete,cargo-deny

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Fixture suite
        run: cargo test --profile gate --test fixtures
      - name: Module graph
        run: cargo xtask modgraph
      - name: Architecture rules
        run: cargo xtask arch
      # The last run's manifest is the base when that run was an ancestor.
      - uses: actions/cache/restore@v4
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}
          restore-keys: test-manifest-
      - name: Test-name manifest
        run: cargo xtask tests
      - name: Keep only this run's manifest
        run: >
          find .corpus-runs/gate/tests -name '*.txt'
          ! -name '${{ github.sha }}.txt' -delete
      - uses: actions/cache/save@v4
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}
      - name: Tests without default features
        run: cargo test --workspace --no-default-features
      - name: Fixture suite without default features
        run: cargo test --profile gate --no-default-features --test fixtures
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benches compile
        run: cargo bench --no-run
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      # --each-feature also builds --all-features unless excluded, and the
      # allocator features refuse to build together.
      - name: Each feature on its own
        run: >
          cargo hack check --workspace --each-feature --exclude-all-features
          --no-dev-deps
      # third_party/hotpath is vendored as released, unused dependencies
      # included.
      - name: Unused dependencies
        run: cargo machete crates tools xtask fuzz
      - name: Licenses, advisories, duplicate versions
        run: cargo deny check
