name: Rust CI

# The build and test half of `cargo xtask gates --full`, and the lints,
# tests and fixtures on the release's other platforms. Each job runs on its
# own runner, so the jobs run side by side. Every runner image, action, tool
# and toolchain is pinned to an exact version (actions by commit), so a run
# changes only with the repository. The corpus, type-snapshot, baseline,
# performance and build-time gates need the frozen Piwigo checkout and a
# stable machine, so they run locally through `cargo xtask gates`. The
# benches are type-checked here rather than built: nothing runs them, and
# `cargo xtask gates --full` still links them.
on:
  push:
  pull_request:

# A pull request's newer run cancels the run it supersedes. A push gets a
# group of its own, so pushes neither wait for nor cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS replaces the flags .cargo/config.toml gives every build, so each
  # value repeats them and adds -D warnings. The x86_64 Linux jobs also link
  # with mold, as the config does for that target.
  RUSTFLAGS: -D warnings -Z threads=8
  # The test profile keeps line tables rather than full debug info. A
  # backtrace still names each frame's file and line; a debugger loses its
  # view of local variables.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings -Z threads=8 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            . -> target
            fuzz -> target
          tools: cargo-hack@0.6.45,cargo-machete@0.9.2,cargo-deny@0.20.2

      # Every later cargo command builds exactly what the lockfiles say. Each
      # check runs whatever the one before it gave, so one failure hides no
      # other.
      - name: Lockfiles match the manifests
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path patches/dhat/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path scripts/probe-vendor/Cargo.toml > /dev/null
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: Module graph
        if: ${{ !cancelled() }}
        run: cargo xtask modgraph
      - name: Architecture rules
        if: ${{ !cancelled() }}
        run: cargo xtask arch
      - name: Recursion rules
        if: ${{ !cancelled() }}
        run: cargo xtask recursion
      - name: Docs
        if: ${{ !cancelled() }}
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benches type-check
        if: ${{ !cancelled() }}
        run: cargo check --release --workspace --benches
      - name: Fuzz targets compile
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      # --each-feature also builds --all-features unless excluded, and the
      # allocator features refuse to build together. Resolver 3 keeps
      # dev-dependency features out of a check without test targets.
      - name: Each feature on its own
        if: ${{ !cancelled() }}
        run: >
          cargo hack check --workspace --each-feature --exclude-all-features
      # Our crates only: vendor/ holds other projects' checkouts.
      - name: Unused dependencies
        if: ${{ !cancelled() }}
        run: cargo machete crates tools xtask fuzz
      - name: Licenses, advisories, duplicate versions
        if: ${{ !cancelled() }}
        run: cargo deny check

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings -Z threads=8 -C link-arg=-fuse-ld=mold
    steps:
      # The test-name manifest searches the whole history for its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: Tests
        run: cargo test --workspace --all-targets --no-fail-fast
      # The heap profiler is a crate of its own, outside the workspace. Its
      # tests take a backtrace through each walk it has.
      - name: The dhat tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib --manifest-path patches/dhat/Cargo.toml
        env:
          RUSTFLAGS: -D warnings -Z threads=8 -C link-arg=-fuse-ld=mold -C force-frame-pointers=yes
      # The last run's manifest is the base when that run was an ancestor.
      # A manifest is kept only when its check passed, so a test that went
      # missing is not taken as the next run's base.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}
          restore-keys: test-manifest-
      # Listed under the test profile the tests above built, so the listing
      # reuses their build.
      - name: Test-name manifest
        id: manifest
        if: ${{ !cancelled() }}
        run: cargo xtask tests --profile test
      - name: Keep only this run's manifest
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        run: >
          find .corpus-runs/gate/tests -name '*.txt'
          ! -name '${{ github.sha }}.txt' -delete
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}

  test-no-default-features:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings -Z threads=8 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Tests without default features
        run: cargo test --workspace --no-default-features --no-fail-fast

  fixtures:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings -Z threads=8 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Fixture suite
        run: cargo test --profile gate --test fixtures
      - name: Fixture suite without default features
        if: ${{ !cancelled() }}
        run: cargo test --profile gate --no-default-features --test fixtures

  # The platforms the release ships besides x86_64 Linux, each in three jobs
  # that run side by side: the check (clippy, then the heap profiler's build),
  # the tests and the fixtures. A job runs whatever its earlier steps gave,
  # so one failure hides no other.
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Windows images check text out with CRLF. .gitattributes keeps this
      # repository's files LF, but not the phpstan-src submodule's stubs,
      # which the build embeds.
      - name: Check text out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      # The heap profiler's build, which walks frame pointers where the
      # platform has them.
      - name: The dhat build
        if: ${{ !cancelled() }}
        run: cargo check -p phpstan-rs --profile dhat --features dhat-heap
        env:
          RUSTFLAGS: -D warnings -Z threads=8 -C force-frame-pointers=yes

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Windows images check text out with CRLF. .gitattributes keeps this
      # repository's files LF, but not the phpstan-src submodule's stubs,
      # which the build embeds.
      - name: Check text out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Tests
        run: cargo test --workspace --all-targets --no-fail-fast
      # The heap profiler is a crate of its own, outside the workspace. On
      # the platforms where it walks frame pointers its tests take a
      # backtrace through that walk; on the rest, through the unwinder.
      - name: The dhat tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib --manifest-path patches/dhat/Cargo.toml
        env:
          RUSTFLAGS: -D warnings -Z threads=8 -C force-frame-pointers=yes
      # What reading a path from its bytes costs against asking `Path`, on
      # each platform's own grammar. The times are in the log.
      - name: The path_bytes bench
        if: ${{ !cancelled() }}
        run: cargo bench -p phpstan-rs-path-bytes --bench path_bytes -- --warm-up-time 1 --measurement-time 2

  platform-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Windows images check text out with CRLF. .gitattributes keeps this
      # repository's files LF, but not the phpstan-src submodule's stubs,
      # which the build embeds.
      - name: Check text out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Fixture suite
        run: cargo test --profile gate --test fixtures
