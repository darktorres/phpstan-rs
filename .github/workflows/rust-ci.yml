name: Rust CI

# The build and test half of `cargo xtask gates --full`. Every runner
# image, action, tool and toolchain is pinned to an exact version (actions
# by commit), so a run changes only with the repository. The corpus,
# type-snapshot, baseline, performance and build-time gates need the
# frozen Piwigo checkout and a stable machine, so they run locally
# through `cargo xtask gates`.
on:
  push:
  pull_request:

# A newer pull-request run cancels the one it supersedes. Push runs are
# never cancelled: each pushed commit keeps its full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Formatting, clippy, the static gates, docs, each feature on its own,
    # the fuzz crate, unused dependencies and licenses. Checks only: nothing
    # here compiles tests or benches.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      # Dependencies are compiled once per profile a job uses and cached per
      # job; a failed job saves its cache too, so the next run starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack@0.6.45,cargo-machete@0.9.2,cargo-deny@0.20.2

      # Every later cargo command builds exactly what the lockfiles say.
      - name: Lockfiles match the manifests
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Module graph
        if: ${{ !cancelled() }}
        run: cargo xtask modgraph
      - name: Architecture rules
        if: ${{ !cancelled() }}
        run: cargo xtask arch
      - name: Docs
        if: ${{ !cancelled() }}
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Fuzz targets compile
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      # --each-feature also builds --all-features unless excluded, and the
      # allocator features refuse to build together. Resolver 3 keeps
      # dev-dependency features out of a check without test targets.
      - name: Each feature on its own
        if: ${{ !cancelled() }}
        run: >
          cargo hack check --workspace --each-feature --exclude-all-features
      # Our crates only: vendor/ holds other projects' checkouts.
      - name: Unused dependencies
        if: ${{ !cancelled() }}
        run: cargo machete crates tools xtask fuzz
      - name: Licenses, advisories, duplicate versions
        if: ${{ !cancelled() }}
        run: cargo deny check

  test:
    # The unit and integration tests in the default feature set, then the
    # test-name manifest, which records this run for the next one.
    runs-on: ubuntu-26.04
    env:
      # Experiment: line tables instead of full debug info for the test
      # profile. Backtraces keep file and line; only variable inspection in
      # a debugger is lost. Kept only if the "Finished" time drops.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      # The test-name manifest searches the whole history for its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      # Dependencies are compiled once per profile a job uses and cached per
      # job; a failed job saves its cache too, so the next run starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - name: Tests
        run: cargo test --workspace --all-targets
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}
          restore-keys: test-manifest-
      # Lists the names under the profile the step above just built, so no
      # dependency or the crate is compiled a second time.
      - name: Test-name manifest
        run: cargo xtask tests --profile test
      - name: Keep only this run's manifest
        run: >
          find .corpus-runs/gate/tests -name '*.txt'
          ! -name '${{ github.sha }}.txt' -delete
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}

  windows-startup:
    # The LSP's startup on Windows. The 1 MiB Windows main thread once made
    # the stub registry take ~40 s to build, and the editor smoke test failed
    # only here, so these checks run on a Windows runner. Release, like the
    # smoke test's own binary: the 10 s budget is for the optimized build.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: LSP startup and stack tests
        run: |
          cargo test --release --locked -p phpstan-rs --test lsp_startup
          cargo test --release --locked -p phpstan-rs --lib cache_dir_tests
          cargo test --release --locked -p phpstan-rs-syntax --lib stack

  test-no-default-features:
    # The same tests with no default features, which are a separate build.
    runs-on: ubuntu-26.04
    env:
      # Experiment: line tables instead of full debug info for the test
      # profile. Backtraces keep file and line; only variable inspection in
      # a debugger is lost. Kept only if the "Finished" time drops.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      # Dependencies are compiled once per profile a job uses and cached per
      # job; a failed job saves its cache too, so the next run starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - name: Tests without default features
        run: cargo test --workspace --no-default-features

  fixtures:
    # The fixture suites run under the gate profile, which builds every dependency
    # at release optimization; the gate profile has its own dependency build.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      # Dependencies are compiled once per profile a job uses and cached per
      # job; a failed job saves its cache too, so the next run starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - name: Fixture suite
        run: cargo test --profile gate --test fixtures
      - name: Fixture suite without default features
        run: cargo test --profile gate --no-default-features --test fixtures

  benches:
    # The benchmark target is type-checked in the release profile the
    # benchmarks run under. The executable is not linked here: `cargo bench`
    # does that locally, and the test job runs each bench once in criterion's
    # test mode.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      # Dependencies are compiled once per profile a job uses and cached per
      # job; a failed job saves its cache too, so the next run starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - name: Benches type-check in the release profile
        run: cargo check --release --benches

  # The runtime oracle on the pinned PHP 8.5.4 runtime: the image built from
  # crates/phpstan-rs/tests/runtime_oracle/Dockerfile, whose base is pinned by
  # digest. The oracle fails, rather than skipping, when that runtime, its
  # packages or its version is wrong.
  runtime-oracle:
    runs-on: ubuntu-26.04
    env:
      PHPSTAN_RS_ORACLE_IMAGE: phpstan-rs-oracle:8.5.4
      PHPSTAN_RS_ORACLE_PHP: "8.5.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - name: Build the pinned PHP runtime image
        run: docker build -t "$PHPSTAN_RS_ORACLE_IMAGE" crates/phpstan-rs/tests/runtime_oracle

      # The oracle profile keeps the debug assertions and overflow checks
      # the fixtures' own assertions depend on, and compiles only the
      # `gate` profile's dependencies plus those two switches.
      - name: Run the runtime oracle on PHP 8.5.4
        run: cargo test --locked -p phpstan-rs --profile oracle --test runtime_oracle
