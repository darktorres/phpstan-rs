name: Rust CI

# The build and test half of `cargo xtask gates --full`, and the lints,
# tests and fixtures on the release's other platforms. Every runner image,
# action, tool and toolchain is pinned to an exact version (actions by
# commit), so a run changes only with the repository. The corpus,
# type-snapshot, baseline, performance and build-time gates need the
# frozen Piwigo checkout and a stable machine, so they run locally
# through `cargo xtask gates`.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      # The test-name manifest searches the whole history for its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # The pinned toolchain, keyed by the file that pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update

      # The cargo registry and the dependencies' build artifacts, keyed by
      # the lockfiles and the toolchain; the workspace's own crates rebuild.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        with:
          mold-version: 2.42.1

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack@0.6.45,cargo-machete@0.9.2,cargo-deny@0.20.2

      # Every later cargo command builds exactly what the lockfiles say.
      - name: Lockfiles match the manifests
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Fixture suite
        run: cargo test --profile gate --test fixtures
      - name: Module graph
        run: cargo xtask modgraph
      - name: Architecture rules
        run: cargo xtask arch
      # The last run's manifest is the base when that run was an ancestor.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}
          restore-keys: test-manifest-
      - name: Test-name manifest
        run: cargo xtask tests
      - name: Keep only this run's manifest
        run: >
          find .corpus-runs/gate/tests -name '*.txt'
          ! -name '${{ github.sha }}.txt' -delete
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus-runs/gate/tests
          key: test-manifest-${{ github.sha }}
      - name: Tests without default features
        run: cargo test --workspace --no-default-features
      - name: Fixture suite without default features
        run: cargo test --profile gate --no-default-features --test fixtures
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benches compile
        run: cargo bench --no-run
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      # --each-feature also builds --all-features unless excluded, and the
      # allocator features refuse to build together. Resolver 3 keeps
      # dev-dependency features out of a check without test targets.
      - name: Each feature on its own
        run: >
          cargo hack check --workspace --each-feature --exclude-all-features
      # Our crates only: vendor/ holds other projects' checkouts.
      - name: Unused dependencies
        run: cargo machete crates tools xtask fuzz
      - name: Licenses, advisories, duplicate versions
        run: cargo deny check

  # The platforms the release ships besides x86_64 Linux. The tests, the
  # fixtures and the dhat build run whatever clippy gave, so one failure
  # hides no other.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows images check text out with CRLF. .gitattributes keeps this
      # repository's files LF, but not the phpstan-src submodule's stubs,
      # which the build embeds.
      - name: Check text out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the pinned toolchain
        run: rustup install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: Fixture suite
        if: ${{ !cancelled() }}
        run: cargo test --profile gate --test fixtures
      # The heap profiler's build, which walks frame pointers where the
      # platform has them.
      - name: The dhat build
        if: ${{ !cancelled() }}
        run: cargo check -p phpstan-rs --profile dhat --features dhat-heap
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
