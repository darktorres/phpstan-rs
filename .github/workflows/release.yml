name: Release

# A `v*` tag push builds the five binaries, runs each, and uploads them to
# that tag's release. `workflow_dispatch` is a dry run on any branch: the
# same builds and runs, and an upload that fails harmlessly, since there is
# no release to upload to.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux legs run on an explicitly pinned Ubuntu LTS image, not
          # `ubuntu-latest`: its glibc is the oldest the binaries run on
          # (README, "Linux glibc compatibility"). When GitHub deprecates
          # the image, re-pin both legs to the oldest LTS it still supports
          # and update that note to match.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          # Built on the arm64 runner, and run there under Rosetta 2.
          - os: macos-26
            target: x86_64-apple-darwin
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      # Windows images check text out with CRLF. .gitattributes keeps this
      # repository's files LF, but not the phpstan-src submodule's stubs,
      # which the build embeds.
      - name: Check text out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds vendor/phpstan-src/src; the other submodules are
      # test corpora the build never reads.
      - name: Fetch the phpstan-src submodule
        run: git submodule update --init --depth 1 vendor/phpstan-src

      # .cargo/config.toml links x86_64 Linux artifacts with mold.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main, 2026-09-12
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        with:
          mold-version: 2.42.1

      # rust-toolchain.toml pins the nightly (and its components);
      # `rustup install` installs it without updating rustup itself.
      - name: Install the pinned toolchain
        run: rustup install --no-self-update
      # Every other leg builds for its runner's own architecture.
      - name: Add the x86_64 macOS target
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: rustup target add x86_64-apple-darwin
      - name: Install Rosetta 2 where the image lacks it
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin_name="phpstan-rs"
          if [[ "$TARGET" == *windows* ]]; then
            bin_name="phpstan-rs.exe"
          fi
          src="target/$TARGET/release/$bin_name"
          dest="phpstan-rs-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then
            dest="$dest.exe"
          fi
          cp "$src" "$dest"
          gzip -k "$dest"
          # macOS has no sha256sum; shasum writes the same line.
          if command -v sha256sum > /dev/null; then
            sha256sum "$dest.gz" > "$dest.gz.sha256"
          else
            shasum -a 256 "$dest.gz" > "$dest.gz.sha256"
          fi

      # The packaged binary prints its version, and checks one file against
      # the stubs it embeds.
      - name: Run the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="./phpstan-rs-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then
            bin="$bin.exe"
          fi
          run=("$bin")
          if [[ "$TARGET" == x86_64-apple-darwin ]]; then
            run=(arch -x86_64 "$bin")
          fi
          version_output="$("${run[@]}" --version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^phpstan-rs [0-9]+\.[0-9]+\.[0-9]+$'
          project="$RUNNER_TEMP/smoke"
          mkdir -p "$project"
          printf '<?php strlen(42);\n' > "$project/a.php"
          report="$("${run[@]}" check-project --no-composer --format json "$project")"
          echo "$report"
          echo "$report" | jq -e '.totals == {"files_checked": 1, "diagnostics": 1}
            and [.files[].messages[].identifier] == ["argument.type"]'

      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bin_name="phpstan-rs-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then
            bin_name="$bin_name.exe"
          fi
          gh release upload "$REF_NAME" "$bin_name.gz" "$bin_name.gz.sha256" \
            --repo "$REPOSITORY" --clobber
        # A `workflow_dispatch` dry run has no release to upload to, so this
        # step fails there; the run is judged by the steps above.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
