name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Pushes to main
# neither queue behind nor cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, doc, port map
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          submodules: "true"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo xtask port-map --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo test --workspace --locked

  # The scoreboard and the cost meter run optimized builds, so the tests
  # run in an optimized profile too.
  test-optimized:
    name: test (release)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo test --workspace --release --locked

  dependencies:
    name: cargo deny, machete
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny@0.20.2,cargo-machete@0.9.2
      - run: cargo deny check
      - run: cargo machete

  # The parity scoreboard, in full: every suite, under the pinned oracle
  # php. The committed parity/score.json must equal the run.
  parity:
    name: parity scoreboard
    runs-on: ubuntu-26.04
    # With the level oracle extracted cold, the job took 8 minutes.
    timeout-minutes: 45
    container:
      # parity/pins.toml [oracle-php] image; a step below checks they agree.
      image: php:8.5.4-cli@sha256:cfa277c10f9f1859addbbed6739673a50a9c1b5777f64c0441118eca148b8056
    steps:
      # From the Debian archive as it was on that day, at exact versions.
      - name: Install git, patch and unzip
        run: |
          cat > /etc/apt/sources.list.d/debian.sources <<'EOF'
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/20261102T000000Z
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/20261102T000000Z
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          EOF
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends git=1:2.47.3-0+deb13u1 patch=2.8-2 unzip=6.0-29+deb13u1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the checkout
        run: git config --global --add safe.directory '*'
      - name: Check the image against the pin
        run: grep -qxF 'image = "php:8.5.4-cli@sha256:cfa277c10f9f1859addbbed6739673a50a9c1b5777f64c0441118eca148b8056"' parity/pins.toml
      - name: Install rustup
        run: |
          curl -sSfL -o /usr/local/bin/rustup-init https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
          echo "5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4  /usr/local/bin/rustup-init" | sha256sum -c
          chmod +x /usr/local/bin/rustup-init
          rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-rust
        with:
          submodules: "true"
      - name: Install composer (parity/pins.toml)
        run: |
          url=$(sed -n '/^\[composer\]/,/^\[/s/^url = "\(.*\)"/\1/p' parity/pins.toml)
          sum=$(sed -n '/^\[composer\]/,/^\[/s/^sha256 = "\(.*\)"/\1/p' parity/pins.toml)
          curl -sSfL -o /usr/local/bin/composer "$url"
          echo "$sum  /usr/local/bin/composer" | sha256sum -c
          chmod +x /usr/local/bin/composer
      - name: Install phpstan-src's dependencies
        run: composer install --no-interaction --no-progress --working-dir=vendor/phpstan-src
      # The extractions are cached by their own keys inside this directory;
      # this key only decides which directory is restored. An older one is
      # restored too: its entries whose keys still match are reused, and the
      # rest are extracted again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/phpstan-rs/parity
          key: parity-${{ hashFiles('parity/extract/**', 'parity/e2e/**', 'parity/pins.toml', 'vendor/phpstan-src/composer.lock') }}
          restore-keys: parity-
      - run: cargo xtask parity
      - name: Check the committed score
        run: git diff --exit-code parity/score.json

  # The cost gate: Ir, peak heap and live heap of every workload, against a
  # build of the base commit made in the same job.
  cost:
    name: cost gate
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          submodules: "true"
      # From the Ubuntu archive as it was on that day, at an exact version.
      - name: Install valgrind
        run: |
          snapshot=https://snapshot.ubuntu.com/ubuntu/20261102T000000Z
          for suite in resolute resolute-updates resolute-security; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $snapshot $suite main universe"
          done | sudo tee /etc/apt/snapshot.list
          apt="sudo apt-get -o Dir::Etc::SourceList=/etc/apt/snapshot.list -o Dir::Etc::SourceParts=-"
          $apt update
          $apt install -y --no-install-recommends valgrind=1:3.26.0-0ubuntu1
      - name: Measure against the base commit
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "no base commit; measuring only"
            cargo xtask cost
          else
            base=$(git merge-base "$BEFORE" HEAD)
            cargo xtask cost --base "$base"
          fi
