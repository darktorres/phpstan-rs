name: Set up Rust
description: >-
  Installs the pinned toolchain and restores the cargo caches, for a job
  that builds this workspace.

inputs:
  submodules:
    description: Whether to fetch the vendor/phpstan-src submodule.
    required: false
    default: "false"
  tools:
    description: Cargo tools to install, each name@version, comma-separated.
    required: false
    default: ""
  cache:
    description: >-
      Whether to restore and save the cargo caches. A release build runs
      without them, so no cache a branch saved goes into a shipped binary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Fetch the phpstan-src submodule
      if: ${{ inputs.submodules == 'true' }}
      shell: bash
      run: git submodule update --init --depth 1 vendor/phpstan-src

    # rust-toolchain.toml pins the toolchain and its components.
    - name: Install the pinned toolchain
      shell: bash
      run: rustup install --no-self-update

    # Saved on failure too, so a red run still warms the next one.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: ${{ inputs.cache == 'true' }}
      with:
        cache-on-failure: true

    - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
      if: ${{ inputs.tools != '' }}
      with:
        tool: ${{ inputs.tools }}
