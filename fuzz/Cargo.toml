[package]
name = "phpstan-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# "derive" needed for structured_php's/parse_type_string's own local
# Arbitrary-derived generator types (Fragment/Expr/Ident/...) - lex_parse
# and token_stream_parse don't need it themselves (Vec<Token>'s Arbitrary
# impl is a blanket one, and Token's own derive lives behind the syntax
# crate's "fuzzing" feature below), but it's harmless for them.
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.phpstan-rs]
path = "../crates/phpstan-rs"

[dependencies.syntax]
package = "phpstan-rs-syntax"
path = "../crates/syntax"
features = ["fuzzing"]

[lib]
name = "phpstan_rs_fuzz"
path = "src/lib.rs"

[[bin]]
name = "lex_parse"
path = "fuzz_targets/lex_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_stream_parse"
path = "fuzz_targets/token_stream_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_php"
path = "fuzz_targets/structured_php.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_type_string"
path = "fuzz_targets/parse_type_string.rs"
test = false
doc = false
bench = false
